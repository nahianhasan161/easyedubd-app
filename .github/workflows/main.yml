name: Production Release

on:
  push:
    branches:
      - main
  # Google Play upload from main happens ONLY when you run this manually
  # (Actions tab -> Production Release -> Run workflow) with upload_to_play = true.
  workflow_dispatch:
    inputs:
      upload_to_play:
        description: "Upload this build to Google Play?"
        type: boolean
        default: false
      play_track:
        description: "Google Play track"
        type: choice
        default: production
        options:
          - production
          - beta
          - alpha
          - internal

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.2"

      - run: flutter pub get

      - name: Decode Keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/upload-keystore.jks

      - name: Create key.properties
        run: |
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.STORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=upload-keystore.jks
          EOF

      # Unique, always-increasing versionCode (minutes since epoch) so Play
      # never rejects an upload as a duplicate, across dev and main builds.
      - name: Compute build number
        run: echo "BUILD_NUMBER=$(( $(date +%s) / 60 ))" >> "$GITHUB_ENV"

      - name: Build APK
        run: flutter build apk --release --build-number=$BUILD_NUMBER

      - name: Build App Bundle
        run: flutter build appbundle --release --build-number=$BUILD_NUMBER

      - name: Copy APK
        run: cp build/app/outputs/flutter-apk/app-release.apk EasyEducationBD.apk

      - name: Update Stable Tag
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git tag -f stable
          git push origin stable --force

      - name: Publish Stable APK
        uses: softprops/action-gh-release@v2.3.3
        with:
          tag_name: stable
          name: Latest Stable
          make_latest: true
          files: EasyEducationBD.apk

      - name: Upload to Google Play (manual only)
        if: github.event_name == 'workflow_dispatch' && inputs.upload_to_play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.easyeducationbd.app
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          tracks: ${{ inputs.play_track }}
          status: completed
