name: Google Play Alpha (dev branch)

# Only pushes to `dev` build an AAB and upload it to the Google Play
# "alpha" (closed testing) track. `local-dev` and other branches never
# reach the Play Store. `main` is handled by main.yml (production).
on:
  push:
    branches:
      - dev
  workflow_dispatch:

concurrency:
  group: play-internal-${{ github.ref }}
  cancel-in-progress: true

jobs:
  upload-internal:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.2"

      - run: flutter pub get

      - name: Decode Keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/upload-keystore.jks

      - name: Create key.properties
        run: |
          cat > android/key.properties <<EOP
          storePassword=${{ secrets.STORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=upload-keystore.jks
          EOP

      # Unique, always-increasing versionCode (minutes since epoch).
      - name: Compute build number
        run: echo "BUILD_NUMBER=$(( $(date +%s) / 60 ))" >> "$GITHUB_ENV"

      - name: Build App Bundle
        run: flutter build appbundle --release --build-number=$BUILD_NUMBER

      - name: Upload to Google Play Alpha (closed testing)
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.easyeducationbd.app
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          tracks: alpha
          status: completed
